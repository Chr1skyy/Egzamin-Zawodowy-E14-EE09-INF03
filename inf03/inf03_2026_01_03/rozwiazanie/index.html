<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Pola figur</title>
    <link rel="stylesheet" href="styl.css">
</head>

<body>
    <header>
        <h2>Pola figur płaskich</h2>
    </header>
    <main>
        <nav>
            <h3>MENU</h3>
            <ul>
                <li><a href="index.html">Prostokąt i trójkąt</a></li>
                <li><a href="kolo.html">Okrąg i koło</a></li>
            </ul>
        </nav>
        <section>
            <img src="img/1d.bmp" alt="Figura" id="figura"><br>
            <img src="img/1m.bmp" alt="Wybierz trójkąt" class="choiceImg" onclick="wybierzFigure('img/1d.bmp')">
            <img src="img/2m.bmp" alt="Wybierz prostokąt" class="choiceImg" onclick="wybierzFigure('img/2d.bmp')">
        </section>
        <aside>
            <h3>Pole prostokąta / pole trójkąta:</h3><br>
            <label for="bokA">Bok prostokąta / podstawa trójkąta:</label><br>
            <input type="text" name="bokA" id="bokA"><br>
            <label for="bokB">Drugi bok prostokąta / wysokość trójkąta:</label><br>
            <input type="text" name="bokB" id="bokB"><br>
            <input type="button" value="Oblicz" onclick="oblicz()">
            <p id="wynik"></p>
        </aside>
    </main>
    <footer>
        <p>Autor: Chr1skyy</p>
    </footer>
    <script src="main.js"></script>
</body>

</html>
